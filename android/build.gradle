buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 28 // Veyra SDK floor
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The Veyra SDK resolves from the authenticated Veyra Maven repository. Credentials come
// from ~/.gradle/gradle.properties (veyraRepoUsername/veyraRepoPassword) or CI env vars —
// see the developer guide. Declared for all projects: the app's own classpath pulls the
// co.veyra:* artifacts transitively through the wrapper.
allprojects {
    repositories {
        maven {
            name = "veyra"
            url = "https://repo.veyra.co/releases"
            credentials {
                username = findProperty("veyraRepoUsername") ?: System.getenv("VEYRA_REPO_USERNAME") ?: ""
                password = findProperty("veyraRepoPassword") ?: System.getenv("VEYRA_REPO_PASSWORD") ?: ""
            }
        }
    }
}
